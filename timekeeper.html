<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Keeper – Project Nanoe Biroe</title>

  <style>
    /* ===== Warna & dasar (selalu terang) ===== */
    :root {
      color-scheme: light;
      --bg: #f8f9fb; --card: #fff; --tx: #1e2a38; --mut: #64748b;
      --ln: #e3e8ef; --ac: #1d6b5a; --hd: #e8efe9;
      --th-bg: #629dc9;     /* warna latar judul kolom (biru) */
      --th-tx: #1e2a38;     /* warna tulisan judul kolom */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--tx);
      font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .wrap { width: 100%; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p  { color: var(--mut); margin: 0 0 16px; }
    .e { color: var(--mut); }

    /* ===== Form & tombol ===== */
    input, button, select { font: inherit; color: var(--tx); }
    input {
      width: 100%; padding: 9px 11px; border: 1px solid var(--ln);
      border-radius: 8px; background: #fff;
    }
    button {
      cursor: pointer; border: 1px solid var(--ln); background: var(--card);
      border-radius: 8px; padding: 8px 14px;
    }
    button:disabled { opacity: .5; cursor: wait; }
    button.pri {
      background: var(--ac); color: #fff; border-color: var(--ac);
      width: 100%; margin-top: 12px;
    }

    /* ===== Login ===== */
    .login {
      max-width: 380px; margin: 12vh auto; background: var(--card);
      border: 1px solid var(--ln); border-radius: 16px; padding: 28px;
      background-image: ;
    }
    .err  { color: #c0392b; font-size: 13px; margin-top: 8px; min-height: 18px; }
    .note { font-size: 13px; color: var(--mut); margin-top: 10px; }
    .warn {
      background: #fdecea; color: #a93226; border: 1px solid #f5c6cb;
      border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 15px;
    }

    /* ===== Bagian atas ===== */
    .bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .bar .e { font-size: 22px; color: var(--tx); font-weight: 600; }
    .badge {
      display: inline-block; padding: 4px 14px; border-radius: 99px;
      font-size: 15px; background: var(--hd); color: var(--ac); margin-left: 10px;
    }

    /* Tombol Keluar & Tambah baris: isi putih, hanya tepi yang biru */
    .bar button, .tools button {
      font-size: 22px;
      font-weight: 600;
      padding: 16px 36px;
      border-radius: 12px;
      background: #ffffff;
      color: #1e2a38;
      border: 5px solid #629dc9;
    }
    .bar button:hover, .tools button:hover {
      background: #eef5fb;
    }

    .tools { display: flex; gap: 14px; margin: 16px 0; align-items: center; }
    #st { font-size: 19px; color: var(--mut); }
    #st.bad { color: #c0392b; }
    .judul { font-size: 26px; letter-spacing: .03em; margin: 20px 0 6px; }

    /* ===== Tabel ===== */
    .tw { overflow-x: auto; padding: 2px; }
    table {
      border-collapse: separate; border-spacing: 0 8px;
      width: 100%; min-width: 1100px;
    }

    /* Baris judul kolom: bar berwarna membulat */
    th {
      background: var(--th-bg); color: var(--th-tx); text-align: left;
      font-size: 14px; font-weight: 700; letter-spacing: .05em;
      padding: 20px 16px; white-space: nowrap;
    }
    th:first-child { border-radius: 16px 0 0 16px; }
    th:last-child  { border-radius: 0 16px 16px 0; }
    .c-no   { width: 70px; }
    .c-kat  { width: 170px; }
    .c-tgl  { width: 190px; }
    .c-aksi { width: 70px; }

    /* Baris data: kartu putih membulat */
    td {
      background: #fff; padding: 8px 16px; font-size: 16px;
      border-top: 1px solid var(--ln); border-bottom: 1px solid var(--ln);
      vertical-align: middle; height: 60px;
    }
    td:first-child { border-left: 1px solid var(--ln); border-radius: 16px 0 0 16px; }
    td:last-child  { border-right: 1px solid var(--ln); border-radius: 0 16px 16px 0; }
    tbody tr:hover td { background: #fbfcfe; }
    .no  { color: var(--mut); font-weight: 600; }
    .jdl { font-weight: 600; }
    .kat {
      display: inline-block; padding: 5px 14px; border-radius: 99px;
      font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    .tgl { white-space: nowrap; }
    .kosong { text-align: center; color: var(--mut); border-radius: 16px !important; }
    .aksi { text-align: center; }
    .del { padding: 6px 12px; font-size: 15px; color: #b42318; }

    /* Kotak isian admin: terlihat seperti teks sampai disorot */
    td input, td select {
      width: 100%; padding: 9px 10px; font-size: 16px;
      border: 1px solid transparent; border-radius: 8px; background: transparent;
    }
    td input:hover, td select:hover { border-color: var(--ln); background: #fff; }
    td input:focus, td select:focus {
      outline: none; border-color: var(--ac); background: #fff;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    /* =========================================================
       PENGATURAN
       ========================================================= */

    // Harus sama dengan $ADMINS di koneksi.php (huruf kecil)
    const ADMINS = ["bayu", "nanoe biroe"];

    const API = "api.php";
    const REFRESH_MS = 15000;   // ambil data terbaru tiap 15 detik

    // Harus sama dengan $KATEGORI di koneksi.php
    const KATEGORI = ["Cover Song", "New Song", "Podcast", "Karakoe"];
    const WARNA = {
      "Cover Song": ["#e6efff", "#2457c5"],
      "New Song":   ["#e3f6ec", "#1b7a4b"],
      "Podcast":    ["#fff1de", "#b45f06"],
      "Karakoe":    ["#f3e8ff", "#7a3db8"],
    };

    const BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli",
                   "Agustus", "September", "Oktober", "November", "Desember"];

    const TANGGAL = ["tv", "dl", "ty"];
    const emptyRow = () => ({ kat: "Cover Song", jdl: "", pen: "", thb: "", tv: "", dl: "", ty: "" });

    /* =========================================================
       STATE & FUNGSI BANTU
       ========================================================= */

    let me = null;                          // { name, role }
    let rows = [];                          // baris dari database (punya id)
    let koneksi = { ok: true, pesan: "" };
    const app = document.getElementById("app");

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // "2026-11-22" -> "22 November 2026"
    function fmt(v) {
      if (!/^\d{4}-\d\d-\d\d$/.test(v)) return v || "";
      const [tahun, bulan, hari] = v.split("-");
      return Number(hari) + " " + BULAN[Number(bulan) - 1] + " " + tahun;
    }

    /* ===== Sesi login (hanya di tab ini) ===== */
    function loadSession()  { try { me = JSON.parse(sessionStorage.getItem("tk_me") || "null"); } catch (e) {} }
    function saveSession()  { try { sessionStorage.setItem("tk_me", JSON.stringify(me)); } catch (e) {} }
    function clearSession() { try { sessionStorage.removeItem("tk_me"); } catch (e) {} }

    /* =========================================================
       PANGGILAN KE api.php
       ========================================================= */

    async function api(aksi, body = {}) {
      let res, teks;
      try {
        res = await fetch(`${API}?aksi=${aksi}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nama: me ? me.name : "", ...body })
        });
        teks = await res.text();
      } catch (e) {
        throw new Error("Server tidak bisa dihubungi.");
      }

      let data;
      try {
        data = JSON.parse(teks);
      } catch (e) {
        throw new Error("Jawaban server bukan JSON. Periksa api.php dan koneksi.php.");
      }
      if (!res.ok || data.error) throw new Error(data.error || "Terjadi kesalahan.");
      return data;
    }

    function setStatus(teks, buruk = false) {
      const el = document.getElementById("st");
      if (!el) return;
      el.textContent = teks;
      el.className = buruk ? "bad" : "";
    }

    // Admin sedang mengetik / memilih di salah satu sel?
    function adminMengetik() {
      const a = document.activeElement;
      return !!(me && me.role === "admin" && a && a.dataset && a.dataset.i);
    }

    /* =========================================================
       READ
       ========================================================= */

    async function loadRows() {
      try {
        const d = await api("list");
        rows = d.rows;
        koneksi = { ok: true, pesan: "" };
      } catch (e) {
        koneksi = { ok: false, pesan: e.message };
      }
      if (me && !adminMengetik()) render();
    }

    /* =========================================================
       TAMPILAN: LOGIN
       ========================================================= */

    function renderLogin() {
      app.innerHTML = `
        <div class="login">
          <h1>⏱ Time Project Studio Niat</h1>
          <p>Project Nanoe Biroe. Masukkan nama Anda untuk masuk, tanpa password.</p>
          <input id="n" placeholder="Nama" autocomplete="off">
          <div class="err" id="er"></div>
          <button class="pri" id="go">Masuk</button>
          <div class="note">Nama Admin dikenali otomatis. Nama lain masuk sebagai User (hanya melihat).</div>
        </div>`;

      const input = document.getElementById("n");
      input.focus();

      function masuk() {
        const nama = input.value.trim();
        if (!nama) { document.getElementById("er").textContent = "Nama wajib diisi."; return; }
        me = { name: nama, role: ADMINS.includes(nama.toLowerCase()) ? "admin" : "user" };
        saveSession();
        render();
        loadRows();
      }
      document.getElementById("go").onclick = masuk;
      input.onkeydown = (e) => { if (e.key === "Enter") masuk(); };
    }

    /* =========================================================
       TAMPILAN: TABEL
       ========================================================= */

    function rowHtml(i, isAdmin) {
      const r = rows[i];
      const no = `<td class="no">${i + 1}</td>`;

      // --- Tampilan User (hanya lihat) ---
      if (!isAdmin) {
        const w = WARNA[r.kat] || ["#eef2f6", "#475569"];
        const tgl = TANGGAL.map((f) =>
          `<td class="tgl">${r[f] ? esc(fmt(r[f])) : '<span class="e">–</span>'}</td>`).join("");
        return `<tr>${no}
          <td><span class="kat" style="background:${w[0]};color:${w[1]}">${esc(r.kat)}</span></td>
          <td class="jdl">${esc(r.jdl || "")}</td>
          <td>${esc(r.pen || "")}</td>
          <td>${esc(r.thb || "")}</td>${tgl}</tr>`;
      }

      // --- Tampilan Admin (bisa edit) ---
      const opsi = KATEGORI.map((k) =>
        `<option${k === r.kat ? " selected" : ""}>${esc(k)}</option>`).join("");
      const inp = (f, tipe) =>
        `<td><input data-i="${i}" data-f="${f}" type="${tipe}" value="${esc(r[f] || "")}"></td>`;

      return `<tr>${no}
        <td><select data-i="${i}" data-f="kat">${opsi}</select></td>
        ${inp("jdl", "text")}${inp("pen", "text")}${inp("thb", "text")}
        ${inp("tv", "date")}${inp("dl", "date")}${inp("ty", "date")}
        <td class="aksi"><button class="del" data-del="${i}" title="Hapus baris">✕</button></td></tr>`;
    }

    function renderApp() {
      const isAdmin = me.role === "admin";
      const lebar = isAdmin ? 9 : 8;

      const body = rows.length
        ? rows.map((_, i) => rowHtml(i, isAdmin)).join("")
        : `<tr><td class="kosong" colspan="${lebar}">Belum ada data.</td></tr>`;

      const warn = koneksi.ok ? "" : `
        <div class="warn"><b>Tidak terhubung ke database.</b> ${esc(koneksi.pesan)}<br>
        Pastikan Apache dan MySQL menyala, dan halaman dibuka lewat
        <code>http://localhost/...</code> (bukan file:///).</div>`;

      const adminTools = isAdmin ? `
        <div class="tools">
          <button id="add">+ Tambah baris</button>
          <span id="st">Perubahan tersimpan otomatis.</span>
        </div>` : "";

      app.innerHTML = `
        <div class="wrap">
          <div class="bar">
            <div>
              <span class="e">Halo, ${esc(me.name)}</span>
              <span class="badge">${isAdmin ? "Admin" : "User · hanya lihat"}</span>
            </div>
            <button id="out">Keluar</button>
          </div>

          ${warn}
          ${adminTools}
          <h2 class="judul">PROJECT NANOE BIROE</h2>

          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th class="c-no">NO</th>
                  <th class="c-kat">KATEGORI</th>
                  <th>JUDUL</th>
                  <th>PENYANYI</th>
                  <th>JUDUL THUMBNAIL</th>
                  <th class="c-tgl">TGL TAKE VOKAL</th>
                  <th class="c-tgl">DEADLINE</th>
                  <th class="c-tgl">TAYANG</th>
                  ${isAdmin ? '<th class="c-aksi"></th>' : ""}
                </tr>
              </thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        </div>`;

      bindEvents(isAdmin);
    }

    /* =========================================================
       EVENT: CREATE, UPDATE, DELETE
       ========================================================= */

    function bindEvents(isAdmin) {
      document.getElementById("out").onclick = () => { me = null; clearSession(); render(); };
      if (!isAdmin) return;

      // UPDATE: simpan satu kolom saat selesai diedit (Enter / pindah sel / pilih)
      app.querySelectorAll("[data-i]").forEach((el) => {
        el.oninput = () => { rows[el.dataset.i][el.dataset.f] = el.value; };
        el.onchange = async () => {
          const r = rows[el.dataset.i];
          if (!r) return;
          r[el.dataset.f] = el.value;
          setStatus("Menyimpan...");
          try {
            await api("ubah", { id: r.id, field: el.dataset.f, nilai: el.value });
            setStatus("Tersimpan ✓");
          } catch (e) {
            setStatus("Gagal menyimpan: " + e.message, true);
          }
        };
      });

      // DELETE
      app.querySelectorAll("[data-del]").forEach((el) => {
        el.onclick = async () => {
          if (!confirm("Hapus baris ini?")) return;
          const i = Number(el.dataset.del);
          el.disabled = true;
          try {
            await api("hapus", { id: rows[i].id });
            rows.splice(i, 1);
            render();
            setStatus("Baris dihapus ✓");
          } catch (e) {
            el.disabled = false;
            setStatus("Gagal menghapus: " + e.message, true);
          }
        };
      });

      // CREATE
      const tambah = document.getElementById("add");
      tambah.onclick = async () => {
        tambah.disabled = true;   // cegah klik ganda
        try {
          const d = await api("tambah");
          rows.push({ ...emptyRow(), id: d.id });
          render();
          setStatus("Baris ditambahkan ✓");
        } catch (e) {
          tambah.disabled = false;
          setStatus("Gagal menambah: " + e.message, true);
        }
      };
    }

    /* =========================================================
       JALANKAN
       ========================================================= */

    function render() { me ? renderApp() : renderLogin(); }

    loadSession();
    render();
    loadRows();

    // Semua orang melihat pembaruan terbaru secara berkala
    setInterval(() => { if (me) loadRows(); }, REFRESH_MS);
  </script>
</body>
</html>
